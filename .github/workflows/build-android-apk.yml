name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'android/**'
      - capacitor.config.json
      - package.json
      - package-lock.json
      - tools/stage_android_web.py
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-24.04
    outputs:
      shas: ${{ steps.list.outputs.shas }}
    steps:
      - name: Check out history for a push
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List commits added to main
        id: list
        shell: bash
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          HEAD_SHA: ${{ inputs.commit || github.sha }}
        run: |
          if [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE"
            fi
            shas=$(git rev-list --first-parent "$BEFORE..$HEAD_SHA")
          fi
          printf '%s\n' "${shas:-$HEAD_SHA}" | jq -Rrsc '"shas=" + (split("\n") | map(select(length > 0)) | tojson)' >> "$GITHUB_OUTPUT"

  apk:
    needs: commits
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.commits.outputs.shas) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the commit
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and sync reader assets
        run: |
          npm ci
          npm run build
          npm run android:sync

      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew --no-daemon --init-script ci-maven-mirror.gradle assembleDebug

      - name: Verify APK signature
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish debug APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: pca-reader-debug-${{ matrix.commit }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
